<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Default clan member avatar</title>
  <desc id="desc">A neutral placeholder avatar for public roster entries without an uploaded image.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151629"/>
      <stop offset="1" stop-color="#231436"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b5c"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="48" fill="url(#bg)"/>
  <circle cx="160" cy="124" r="58" fill="#2c2f49"/>
  <path d="M64 283c10-61 47-94 96-94s86 33 96 94" fill="#2c2f49"/>
