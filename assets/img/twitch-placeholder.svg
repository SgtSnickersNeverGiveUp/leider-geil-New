<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Twitch video placeholder</title>
  <desc id="desc">A public placeholder image for Twitch videos without a thumbnail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17142f"/>
      <stop offset="1" stop-color="#301052"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9146ff"/>
      <stop offset="1" stop-color="#ff3b5c"/>
